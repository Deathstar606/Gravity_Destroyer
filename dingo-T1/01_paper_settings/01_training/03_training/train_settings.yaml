data:
  waveform_dataset_path: /home/deathstar/dingorep/dingo-T1/01_paper_settings/01_training/01_waveform_dataset/waveform_dataset.hdf5
  train_fraction: 0.9
  window:
    type: tukey
    f_s: 4096
    T: 8.0
    roll_off: 0.4
  detectors:
    - H1
    - L1
    - V1
  extrinsic_prior:
    dec: default
    ra: default
    geocent_time: bilby.core.prior.Uniform(minimum=-0.1, maximum=0.1)
    psi: default
    luminosity_distance: bilby.core.prior.Uniform(minimum=100.0, maximum=6000.0)
  ref_time: 1126259462.391
  inference_parameters:
    - beta_residual
    - chirp_mass
  context_parameters:
    - beta_proxy
    - mass_ratio
    - chi1z
    - chi2z
    - luminosity_distance
    - theta_jn
  tokenization:
    token_size: 16
    drop_detectors:
      p_drop_012_detectors: [0.6, 0.3, 0.1]
      p_drop_hlv:
        H1: 0.3
        L1: 0.3
        V1: 0.4
    drop_frequency_range:
      f_cut:
        p_cut: 0.25
        f_max_lower_cut: 180.
        f_min_upper_cut: 80.
        p_same_cut_all_detectors: 0.7
        p_lower_upper_both: [0.1, 0.7, 0.2]
      mask_interval:
        p_per_detector: 0.1
        f_min: 20.
        f_max: 1800.
        max_width: 10.

model:
  #beyond_gr_checkpoint: /home/deathstar/dingorep/dingo-T1/02_inference_with_pretrained_model/dingo_t1.pt
  beyond_gr_checkpoint: /home/deathstar/dingorep/dingo-T1/02_inference_with_pretrained_model/model_stage_0.pt
  posterior_model_type: normalizing_flow
  posterior_kwargs:
    beyond_gr: True
    #param_dim: 2
    #context_dim: 134
    num_flow_steps: 10 # Reduced from 30 for memory efficiency
    base_transform_kwargs:
      hidden_dim: 256 # Reduced from 512 #🧧
      num_transform_blocks: 2 #🧧
      activation: elu
      batch_norm: False
      layer_norm: True
      dropout_probability: 0.0
      num_bins: 8
      base_transform_type: rq-coupling
  embedding_type: transformer
  embedding_kwargs:
    tokenizer_kwargs:
      condition_on_position: True
      hidden_dims: [512]
      activation: elu
      beyond_gr: True
      batch_norm: False
      layer_norm: True
    transformer_kwargs:
      d_model: 1024
      dim_feedforward: 2048
      nhead: 16
      dropout: 0.0
      num_layers: 8
      norm_first: True
    pooling: cls
    final_net_kwargs:
      activation: elu
      output_dim: 128
    allow_tf32: False

training:
  stage_0:
    # Stage 0: Train only the newly initialized 2D NSF while keeping the
    # pretrained transformer frozen.
    epochs: 4
    freeze_all_except_last_n_layers: 2

    asd_dataset_path: /home/deathstar/dingorep/dingo-T1/01_paper_settings/01_training/02_asd_dataset/asds_O3.hdf5

    optimizer:
      type: adamw
      lr: 0.0001
      betas:
        - 0.8
        - 0.99
      weight_decay: 0.005

    scheduler:
      type: cosine

    early_stopping:
      patience: 10
      delta: 0.0
      metric: validation

    automatic_mixed_precision: True
    gradient_updates_per_optimizer_step: 2
    batch_size: 64

local:
  device: xpu # Intel Arc GPU
  num_workers: 4 # Reduced from 8 for single GPU
  runtime_limits:
    max_time_per_run: 1_000_000
    max_epochs_per_run: 50
  checkpoint_epochs: 10
  copy_waveform_dataset_to_tmp: False # Disable for testing
  local_cache_path: /tmp
  # XPU-specific settings handled in training script
